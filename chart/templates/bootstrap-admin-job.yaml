{{- if .Values.bootstrapAdmin.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-bootstrap-admin-{{ .Release.Revision }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: bootstrap
          image: "{{ .Values.image.repository }}-backend:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/bootstrap-admin"]
          env:
            - name: ADMIN_EMAIL
              value: {{ required "bootstrapAdmin.email required when bootstrapAdmin.enabled" .Values.bootstrapAdmin.email | quote }}
            - name: ADMIN_PASSWORD
              value: {{ required "bootstrapAdmin.password required when bootstrapAdmin.enabled" .Values.bootstrapAdmin.password | quote }}
            - name: ADMIN_DISPLAY_NAME
              value: {{ .Values.bootstrapAdmin.displayName | quote }}
          envFrom:
            - secretRef:
                name: {{ .Release.Name }}-app
{{- end }}
